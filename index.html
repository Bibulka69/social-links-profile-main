<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" src="/assets/fonts/Inter-VariableFont_slnt,wght.ttf">
  <link rel="stylesheet" href="assets/style/style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main>
    <article class="profile-card profile-card--inner">
      <div class="profile-card__avatar--inner">
        <img src="assets/images/photo_2026-09-06_20-36-18.jpg" class="profile-card__avatar" alt="profile avatar">
      </div>
      <h1 class="profile-card__name">Orina</h1>
      <p class="profile-card__address">Saint Petersburg, Russia</p>
      <p class="profile-card__description">"Front-end developer and designer"</p>
      <div class="profile-card__links--inner">
        <button class="profile-card__social-button profile-card__social-button--inner"><a href="https://github.com/Bibulka69">GitHub</a></button>
        <button class="profile-card__social-button profile-card__social-button--inner"><a href="https://www.frontendmentor.io/profile/Bibulka69">Frontend Mentor</a></button>
      </div>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
